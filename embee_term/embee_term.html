<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eMBee TERM</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #000;
            color: #33ff00; /* Classic VT100 phosphor green */
            font-family: monospace;
            overflow-x: hidden;
            white-space: pre-wrap;
            word-break: break-all;
            text-shadow: 0 0 4px rgba(51, 255, 0, 0.7); /* CRT Glow */
            cursor: default;
        }
        
        /* Hide scrollbars for absolute terminal purity */
        ::-webkit-scrollbar {
            display: none;
        }

        #cursor {
            display: inline-block;
            width: 1ch;
            background-color: #33ff00;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 5px #33ff00;
            /* Alignment managed dynamically by JS to prevent line-height stretching */
            vertical-align: baseline;
            position: relative;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <span id="output">CLICK TO CONNECT...</span><span id="cursor"></span>

    <script>
        let port;
        let isConnected = false;
        let isTransmitting = false;
        const txQueue = [];
        const output = document.getElementById('output');
        const cursor = document.getElementById('cursor');

        // --- Screen & Font Scaling Logic ---
        function resizeTerminal() {
            const isLandscape = window.innerWidth > window.innerHeight;
            const cols = isLandscape ? 80 : 40;
            
            // Measure the exact aspect ratio of the browser's default monospace font
            const testSpan = document.createElement('span');
            testSpan.style.fontFamily = 'monospace';
            testSpan.style.fontSize = '100px';
            testSpan.style.position = 'absolute';
            testSpan.style.visibility = 'hidden';
            testSpan.textContent = 'X';
            document.body.appendChild(testSpan);
            
            const charWidth = testSpan.getBoundingClientRect().width;
            document.body.removeChild(testSpan);
            
            // Calculate font size to fit columns perfectly
            const ratio = charWidth / 100;
            const newFontSize = (window.innerWidth / cols) / ratio;
            
            // Fix vertical gap: Calculate a line-height that perfectly divides the screen height
            const naturalLineHeight = newFontSize * 1.2;
            const numRows = Math.floor(window.innerHeight / naturalLineHeight);
            const fittedLineHeight = window.innerHeight / numRows;
            
            document.body.style.fontSize = (newFontSize * 0.99) + 'px';
            document.body.style.lineHeight = fittedLineHeight + 'px';
            
            // Size and position the cursor so it doesn't push the line box taller
            cursor.style.height = (newFontSize * 0.9) + 'px';
            cursor.style.top = (newFontSize * 0.1) + 'px';
            
            window.scrollTo(0, document.body.scrollHeight);
        }

        window.addEventListener('resize', resizeTerminal);
        resizeTerminal(); // Run once on load

        // --- Connection Flow ---
        document.addEventListener('click', async () => {
            if (isConnected) return;
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                isConnected = true;
                
                output.textContent = ''; // Clear initial message
                
                // Request Fullscreen for the true 1970s feel
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }

                readLoop();
            } catch (err) {
                console.error('Connection failed or cancelled.', err);
            }
        });

        // --- RX Logic (Receiving) ---
        async function readLoop() {
            while (port.readable) {
                const reader = port.readable.getReader();
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        const str = new TextDecoder().decode(value);
                        printString(str);
                    }
                } catch (error) {
                    console.error(error);
                } finally {
                    reader.releaseLock();
                }
            }
        }

        function printString(str) {
            for (let i = 0; i < str.length; i++) {
                let c = str[i];
                if (c === '\b' || c === '\x7F') {
                    output.textContent = output.textContent.slice(0, -1);
                } else if (c === '\r') {
                    // Ignore carriage return, let \n handle the break
                } else {
                    output.textContent += c;
                }
            }
            window.scrollTo(0, document.body.scrollHeight);
        }

        // --- TX Logic (Sending & Queuing) ---
        async function processQueue() {
            if (isTransmitting || txQueue.length === 0 || !port || !port.writable) return;
            isTransmitting = true;
            const writer = port.writable.getWriter();
            
            try {
                while (txQueue.length > 0) {
                    const char = txQueue.shift();
                    await writer.write(new TextEncoder().encode(char));
                    // 15ms delay per char prevents eMBee TWO UART buffer overflow
                    await new Promise(r => setTimeout(r, 15));
                }
            } catch (err) {
                console.error(err);
            } finally {
                writer.releaseLock();
                isTransmitting = false;
            }
        }

        // Handle Keyboard Typing
        window.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;

            if (e.ctrlKey && e.key === 'c') {
                txQueue.push('\x03'); // Ctrl+C (Break)
                e.preventDefault();
            } else if (e.key === 'Enter') {
                txQueue.push('\r'); // eMBee TWO expects \r
                e.preventDefault();
            } else if (e.key === 'Backspace') {
                txQueue.push('\b'); // Backspace
                e.preventDefault();
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                txQueue.push(e.key);
                e.preventDefault();
            }
            processQueue();
        });

        // Handle Pasting (Breaks clipboard blocks into delayed single characters)
        window.addEventListener('paste', (e) => {
            if (!isConnected) return;
            
            const text = e.clipboardData.getData('text');
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '\n') char = '\r'; // Convert newlines to CR
                txQueue.push(char);
            }
            processQueue();
            e.preventDefault();
        });

    </script>
</body>
</html>
