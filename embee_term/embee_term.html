<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eMBee TERM</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Lock the outer window */
        }
        
        #terminal {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #33ff00; /* Classic VT100 phosphor green */
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: scroll; /* Let terminal scroll internally */
            overflow-x: hidden;
            text-shadow: 0 0 4px rgba(51, 255, 0, 0.7); /* CRT Glow */
            cursor: default;
        }

        /* Hide scrollbars for absolute terminal purity */
        #terminal::-webkit-scrollbar {
            display: none;
        }
        #terminal {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #cursor {
            color: #33ff00;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body><div id="terminal"><span id="output">CLICK TO CONNECT...</span><span id="cursor">&#9608;</span></div><script>
        let port;
        let isConnected = false;
        let isTransmitting = false;
        const txQueue = [];
        const terminal = document.getElementById('terminal');
        const output = document.getElementById('output');

        // --- Screen & Font Scaling Logic ---
        function resizeTerminal() {
            const isLandscape = window.innerWidth > window.innerHeight;
            const cols = isLandscape ? 80 : 40;
            
            // Measure the exact dimensions of the browser's default monospace font
            const testDiv = document.createElement('div');
            testDiv.style.fontFamily = 'monospace';
            testDiv.style.fontSize = '100px';
            testDiv.style.lineHeight = '1';
            testDiv.style.position = 'absolute';
            testDiv.style.visibility = 'hidden';
            testDiv.style.whiteSpace = 'pre';
            testDiv.style.padding = '0';
            testDiv.style.margin = '0';
            testDiv.textContent = 'X'.repeat(cols);
            document.body.appendChild(testDiv);
            
            const totalWidth = testDiv.getBoundingClientRect().width;
            const charHeight = testDiv.getBoundingClientRect().height;
            document.body.removeChild(testDiv);
            
            // Calculate exact font size to fit columns perfectly horizontally
            const scaleFactor = window.innerWidth / totalWidth;
            const newFontSize = 100 * scaleFactor;
            
            // Calculate height scaling to perfectly eliminate vertical black gaps
            const naturalRowHeight = charHeight * scaleFactor;
            const numRows = Math.floor(window.innerHeight / naturalRowHeight);
            const fittedLineHeight = window.innerHeight / numRows;
            
            // Apply (subtract a tiny fraction horizontally to prevent float rounding wraps)
            terminal.style.fontSize = (newFontSize * 0.99) + 'px';
            terminal.style.lineHeight = fittedLineHeight + 'px';
            
            terminal.scrollTop = terminal.scrollHeight;
        }

        window.addEventListener('resize', resizeTerminal);
        resizeTerminal(); // Run once on load

        // --- Connection Flow ---
        document.addEventListener('click', async () => {
            if (isConnected) return;
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                isConnected = true;
                
                output.textContent = ''; // Clear initial message
                
                // Request Fullscreen for the true 1970s feel
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }

                readLoop();
            } catch (err) {
                console.error('Connection failed or cancelled.', err);
            }
        });

        // --- RX Logic (Receiving) ---
        async function readLoop() {
            while (port.readable) {
                const reader = port.readable.getReader();
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        const str = new TextDecoder().decode(value);
                        printString(str);
                    }
                } catch (error) {
                    console.error(error);
                } finally {
                    reader.releaseLock();
                }
            }
        }

        function printString(str) {
            for (let i = 0; i < str.length; i++) {
                let c = str[i];
                if (c === '\b' || c === '\x7F') {
                    output.textContent = output.textContent.slice(0, -1);
                } else if (c === '\r') {
                    // Ignore carriage return, let \n handle the break naturally
                } else {
                    output.textContent += c;
                }
            }
            terminal.scrollTop = terminal.scrollHeight;
        }

        // --- TX Logic (Sending & Queuing) ---
        async function processQueue() {
            if (isTransmitting || txQueue.length === 0 || !port || !port.writable) return;
            isTransmitting = true;
            const writer = port.writable.getWriter();
            
            try {
                while (txQueue.length > 0) {
                    const char = txQueue.shift();
                    await writer.write(new TextEncoder().encode(char));
                    // 15ms delay per char prevents eMBee TWO UART buffer overflow
                    await new Promise(r => setTimeout(r, 15));
                }
            } catch (err) {
                console.error(err);
            } finally {
                writer.releaseLock();
                isTransmitting = false;
            }
        }

        // Handle Keyboard Typing
        window.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;

            if (e.ctrlKey && e.key === 'c') {
                txQueue.push('\x03'); // Ctrl+C (Break)
                e.preventDefault();
            } else if (e.key === 'Enter') {
                txQueue.push('\r'); // eMBee TWO expects \r
                e.preventDefault();
            } else if (e.key === 'Backspace') {
                txQueue.push('\b'); // Backspace
                e.preventDefault();
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                txQueue.push(e.key);
                e.preventDefault();
            }
            processQueue();
        });

        // Handle Pasting (Breaks clipboard blocks into delayed single characters)
        window.addEventListener('paste', (e) => {
            if (!isConnected) return;
            
            const text = e.clipboardData.getData('text');
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '\n') char = '\r'; // Convert newlines to CR
                txQueue.push(char);
            }
            processQueue();
            e.preventDefault();
        });

</script></body>
</html>
