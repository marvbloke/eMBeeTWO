[platformio]
lib_dir = lib
default_envs = nano_tester

[env]
framework = arduino
lib_deps = 
	greiman/SSD1306Ascii@1.3.5
	Wire
	EEPROM

lib_ldf_mode = off

; Expand HardwareSerial RX buffer from 64 bytes to 256 bytes
build_flags = 
    -D SERIAL_RX_BUFFER_SIZE=256

platform_packages =
    toolchain-atmelavr @ 3.70300.220127

; --- Environment 1: Hardware Testing on Arduino Nano Clone ---
[env:nano_tester]
platform = atmelavr
board = nanoatmega328
monitor_speed = 115200

; --- Environment 2: Final eMBee TWO Hardware (ATmega328P @ 8MHz Internal Clock, 3.3V) ---
[env:standalone_8mhz]
platform = atmelavr
board = ATmega328P
board_build.f_cpu = 8000000L
board_hardware.bod = 2.7v