[platformio]
default_envs = nano_tester

[env]
framework = arduino
lib_deps = 
	greiman/SSD1306Ascii@^1.3.5

; Force PlatformIO to deeply scan all headers inside installed libraries
lib_ldf_mode = deep

platform_packages =
    toolchain-atmelavr @ ~3.70300.0

; --- Environment 1: Hardware Testing on Arduino Nano Clone ---
[env:nano_tester]
platform = atmelavr
board = nanoatmega328
monitor_speed = 115200

; --- Environment 2: Final eMBee TWO Hardware (ATmega328P @ 8MHz Internal Clock, 3.3V) ---
[env:standalone_8mhz]
platform = atmelavr
board = ATmega328P
board_build.f_cpu = 8000000L
board_hardware.bod = 2.7v